name: Deploy no GitHub Pages

# Publica o site estático a cada push na branch principal.
# Pré-requisito (uma vez): Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # O site é estático: não há build. Só excluímos o que não deve ir ao ar.
      - name: Preparar artefato
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude 'node_modules' \
                   --exclude 'scripts' \
                   --exclude 'audit-*' \
                   --exclude '_site' \
                   --exclude 'package*.json' \
                   --exclude 'audit-congresso.mjs' \
                   ./ _site/

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
